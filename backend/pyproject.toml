[project]
name = "python-cards-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT==2.15.1",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-env>=1.1.0",
]