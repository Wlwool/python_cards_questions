[project]
name = "python-cards-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram~=3.31.0",
    "aiohttp~=3.14.3",
    "apscheduler~=3.11.3",
    "sqlalchemy==2.1.3",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
